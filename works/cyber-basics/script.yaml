# 解説動画『脆弱性とサイバー攻撃 — なぜ、同じ三つなのか』
# ミライ（人）とミラボ（AIパートナー）の掛け合い。約4分半。
# 構成は「三つの境界」: 入力（命令との境目）・メモリ（確保した範囲の境目）・依存（自分と他人の境目）。
# 各章で「昔の事件」と「今の事件」を並べ、同じ形だと示す。終章で「なぜ三つか」に答える。
#
# 演技は「効く欄」だけで振る。記号（文末に1つ・短い行）・speed・pause_before・volume。
# emotion は「neutral か、そうでないか」の粗いスイッチとしてだけ使う（感情どうしは区別できない）。
# delivery は flat / cold だけ（測って動くのは12語のうち4語、本作に要るのはこの2語）。
# pitch・intonation・subtext・intensity は書かない（音が動かない）。設計は 資料/…/演技の設計.md。
#
# テンポ: ミライは fast を基調、ミラボは fast〜very_fast（ミラボのほうが速い）。
# 落とすのは「静かな所」だけ（c23・c34・c46b）。全体を速くすると、遅い所が効く。
# 章の頭（c07/c17/c30/c47）だけ 1.6 秒。鐘が cue の 1.6 秒手前に鳴るので、そこで前の行が終わる。
#
# 行は文の切れ目で割る（cNN と cNNb）。長い行は ！ も ？ も効かないため。
# ！ は全編で4つ（c01 / c11b / c14 / c55）。増やすと効かなくなる。
# seed は全行 1（省略時も 1）。
#
# 表記の方針: line は Tsukasa が読む形（カタカナ）。字幕の原表記は video.yaml の display。
# 数は 資料_脆弱性とサイバー攻撃_2026.md の「使う数」だけを使う。
name: cyber-basics
default_pause: 0.25
cues:
  # ── 序章
  - {character: mirabo, line: "ミライさん！", emotion: excitement, intensity: subtle, volume: loud, speed: very_fast, pause_before: 0.8, name: c01}
  - {character: mirabo, line: "また、大きな攻撃のニュースだよ。", emotion: excitement, intensity: subtle, speed: fast, pause_before: 0.12, name: c01b}
  - {character: mirai, line: "うん。今日は、別の角度から話そう。", speed: very_fast, pause_before: 0.3, name: c02}
  - {character: mirai, line: "なぜ、同じ場所が壊れるのか。", speed: fast, pause_before: 0.3, name: c02b}
  - {character: mirabo, line: "同じ場所？", speed: very_fast, pause_before: 0.25, name: c03}
  - {character: mirai, line: "入力、メモリ、依存。", speed: fast, pause_before: 0.35, name: c04}
  - {character: mirai, line: "20年《にじゅうねん》、名前が変わっても、この三つだ。", speed: very_fast, pause_before: 0.15, name: c04b}
  - {character: mirabo, line: "20年《にじゅうねん》も？", emotion: joy, intensity: subtle, speed: fast, pause_before: 0.22, name: c05}
  - {character: mirai, line: "そう。三つとも、いまも、直っていない。", emotion: confidence, intensity: moderate, speed: very_fast, pause_before: 0.3, name: c06}

