  - {character: mirai, line: "そう。インジェクション。", speed: fast, pause_before: 0.3, name: c12}
  - {character: mirai, line: "入力と命令の境目が、壊れる。", emotion: confidence, intensity: moderate, speed: very_fast, pause_before: 0.3, name: c12b}
  - {character: mirai, line: "2021年、ログフォーシェル。", speed: fast, pause_before: 0.35, name: c13}
  - {character: mirai, line: "ログに書いた文字が、遠くのコードを呼び出した。", speed: very_fast, pause_before: 0.15, name: c13b}
  - {character: mirabo, line: "ログって、記録するだけじゃないんだ！", emotion: excitement, intensity: subtle, volume: loud, speed: very_fast, pause_before: 0.25, name: c14}
  - {character: mirai, line: "記録する場所が、実行する場所になった。", speed: very_fast, pause_before: 0.3, name: c15}
  - {character: mirai, line: "世界中が、急いで直した。", speed: very_fast, pause_before: 0.3, name: c15b}
  - {character: mirai, line: "でも、同じ形は、まだ一番多い。", speed: very_fast, pause_before: 0.3, name: c16}
  - {character: mirai, line: "去年、悪用された脆弱性の、四割が昔からある型だ。", speed: very_fast, pause_before: 0.15, name: c16b}
  - {character: mirai, line: "2007年に、もう“言い訳が立たない”とされた型が、", speed: fast, pause_before: 0.3, name: c16c}
  - {character: mirai, line: "まだ、上位に3つ残っている。", speed: fast, pause_before: 0.25, name: c16d}

  # ── 第2章 メモリ
  - {character: mirai, line: "ふたつめは、メモリ。", speed: fast, pause_before: 1.6, name: c17}
  - {character: mirai, line: "確保した場所の外を、読んでしまう。", speed: very_fast, pause_before: 0.15, name: c17b}
