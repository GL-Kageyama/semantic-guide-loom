  - {character: mirai, line: "漏れたのは、ログインした後の、クッキー。", speed: very_fast, pause_before: 0.2, name: c27b}
  - {character: mirabo, line: "鍵を、持っていかれたんだ。", emotion: anxiety, intensity: subtle, volume: quiet, speed: natural, pause_before: 0.35, name: c28}
