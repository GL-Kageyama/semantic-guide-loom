  - {character: mirai, line: "これは、技術だけでは守れない場所。", volume: quiet, speed: slow, pause_before: 0.35, name: c46b}

  # ── 終章
  - {character: mirai, line: "入力、メモリ、依存。", speed: fast, pause_before: 1.6, name: c47}
  - {character: mirabo, line: "じゃあ、三つを塞げばいい？", emotion: joy, intensity: subtle, speed: fast, pause_before: 0.3, name: c48}
  - {character: mirai, line: "塞ぐだけでは足りない。", speed: very_fast, pause_before: 0.35, name: c49}
  - {character: mirai, line: "去年、新しく登録された脆弱性は、一年で2倍になった。", speed: very_fast, pause_before: 0.3, name: c49b}
