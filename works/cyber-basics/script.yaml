  - {character: mirabo, line: "どうやって？", speed: very_fast, pause_before: 0.25, name: c41}
  - {character: mirai, line: "部品を公開する、自動の仕組みが、狙われた。", speed: very_fast, pause_before: 0.3, name: c42}
  - {character: mirai, line: "気づいたときには、正しい手順で、偽物が配られていた。", speed: very_fast, pause_before: 0.25, name: c42b}
