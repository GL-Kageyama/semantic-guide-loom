  - {character: mirabo, line: "静かに、少しずつ。", emotion: anxiety, intensity: subtle, volume: quiet, speed: slow, delivery: flat, pause_before: 0.35, name: c23}
  - {character: mirai, line: "そう。壊す音がしない。", speed: fast, pause_before: 0.35, name: c24}
