  - {character: mirai, line: "たとえば、ログイン画面。", speed: very_fast, pause_before: 0.25, name: c09}
  - {character: mirai, line: "名前を入れる欄がある。", speed: very_fast, pause_before: 0.15, name: c09b}
  - {character: mirai, line: "そこに、命令を混ぜられたら？", speed: very_fast, pause_before: 0.3, name: c10}
  - {character: mirabo, line: "名前だと思って読んだら、", speed: very_fast, pause_before: 0.25, name: c11}
