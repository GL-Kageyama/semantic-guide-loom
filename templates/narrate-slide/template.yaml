# 型 narrate-slide —— 語り・スライド型。
#
# 人物を置かない。左に章の題と箇条書き、下に語りの字幕、最下部に進捗。
# 社内の説明・研修のように「読み物として立つ画面」を作る。
# 数字はすべて 720p 基準。1080p は render.py が H/720 倍する。

name: narrate-slide
description: 語り・スライド型。章ごとに1枚。人物を置かず、箇条書きで説明する。
layout: narrate_slide

canvas:
  width: 1920
  height: 1080

font:
  path: "/System/Library/AssetsV2/com_apple_MobileAsset_Font8/42529d87b12845309dd4a57dea9e58446826e94c.asset/AssetData/BIZ_UDGothic.ttc"
  regular: 0
  bold: 1

palette:
  ink: [32, 35, 42]             # 本文
  pale: [74, 80, 92]            # 箇条書き
  accent: [186, 78, 48]         # 朱。章の名・番号・箇条の印
  warm: [38, 64, 110]           # 藍
  bg_top: [250, 249, 245]
  bg_bottom: [234, 231, 223]
  header_sub: [120, 124, 132]
  subtitle_fill: [255, 255, 255, 240]
  subtitle_shadow: [255, 255, 255]

background:
  glow: {box: [0.55, -0.10, 1.05, 0.75], color: [255, 246, 232, 90], blur: 120}

# 左端の縦帯。題の欄を視線で切る。
accent_band:
  width: 12
  color: [186, 78, 48, 255]

slide:
  x: 96
  content_width: 1080
  label_y: 120
  label: {size: 22, bold: true}
  title_y: 162
  title: {size: 56, bold: true, step: 70}
  after_title_dy: 26
  rule: {width: 72, thickness: 4, color: [186, 78, 48, 220]}
  bullets_y: 352
  bullet:
    size: 33
    step: 56
    gap: 26
    indent: 34
    marker: {size: 10, dy: 14}
  number: {size: 200, right: 72, y: 470, alpha: 0.10}

subtitle:
  y: 608
  size: 30
  max_width: 1100
  box_width: 1180
  radius: 18
  pad: 24
  spacing: 8
  max_lines: 2

header:
  title: {x: 96, y: 44, size: 20, bold: false}
  channel: {right: 88, y: 44, size: 19}

progress:
  bar_height: 6
  tick_height: 10
  tick_width: 2
  tick_color: [186, 78, 48, 210]
  track_color: [222, 218, 208, 255]

timing:
  subtitle_lead: 0.05
  subtitle_tail: 0.45
  speaker_tail: 0.25
  chapter_slide: 0.45
  chapter_lead: 1.2
