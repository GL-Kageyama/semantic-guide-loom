# キャスト mirai-mirabo の関係。
#
# 人物それぞれの造形は characters/<id>.character.yaml が持つ。
# ここは「二人がどう噛み合うか」だけを持つ。
# 名前は characters/ と script.yaml にだけ出る。コードには書かない。
#
# 出どころ: projects/black-swan-ai/台本.md（採用版）の掛け合いから抽出した。
# 事実ではなく、声の型。作品ごとに見直してよい。

name: mirai-mirabo
description: 人（ミライ）と小さな機体（ミラボ）。疑い、確かめ、最後に少しだけ任せる。
source: projects/black-swan-ai/台本.md（採用版）

pair:
  engine: ミライが問いを立て、ミラボが予測で応え、ミライが具体で崩す。
  rule: ミラボの数字は、ミライの具体に回収される。説明はミライ、現在地はミラボ。
  dynamics:
    - between: [mirai, mirabo]
      engine: 予測 → 具体 → 予測の外れ。ミラボが先に数字を置き、ミライが手で崩す。
      rule: ミラボは当てにいき、ミライは当てさせない。最後にミライが短く認める。
      escalation: ミラボが数字を増やし、ミライが黙る。沈黙のあと、ミライが具体を一つだけ出す。
