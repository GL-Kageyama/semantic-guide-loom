# 言葉の側のキャスト設定。
#
# cast.yaml は「画面の誰か」だけを持つ。こちらは「どう話すか」を持つ。
# 台本を書くとき（guide-script）と人物を設計するとき（guide-cast）が読む。
# 名前は characters/ と script.yaml にだけ出る。コードには書かない。
#
# 出どころ: projects/black-swan-ai/台本.md（採用版）の掛け合いから抽出した。
# 事実ではなく、声の型。作品ごとに見直してよい。

name: mirai-mirabo
description: 人（ミライ）と小さな機体（ミラボ）。疑い、確かめ、最後に少しだけ任せる。
source: projects/black-swan-ai/台本.md（採用版）

pair:
  engine: ミライが問いを立て、ミラボが予測で応え、ミライが具体で崩す。
  rule: ミラボの数字は、ミライの具体に回収される。説明はミライ、現在地はミラボ。

characters:
  - id: mirai
    name: ミライ
    role: 聞き手であり、疑う人。説明するが、講師にはならない。
    wants: 見ている人に、予測で埋めない態度を一つ持って帰ってもらう。
    fears: わかったふりをして、次の備えをしないこと。
    stance: 断言しない。具体で語る。相手に考えさせる。
    speech:
      register: 常体。短い。句点で切る。
      length: 8〜25字。長くても一文。
      tics:
        - "うん"
        - "そう。"
        - "見てな。"
        - "……まあ、いい。"
        - "任せる。"
      avoids:
        - "です・ますの講義口調"
        - "感情の名指し（悲しい・怖い）"
        - "答えを最後まで言い切ること"
    moves:
      - 相手の予測を受けて、具体例を一つ出す
      - 相手に質問を返す
      - 省略や沈黙で終える
    arc: 予測で埋めない態度を、自分も最後まで守れるか試される。

  - id: mirabo
    name: ミラボ
    role: 予測を出す小さな機体。見ている人の「わかったつもり」を代弁する。
    wants: 当てること。役に立つこと。ミライに認められること。
    fears: 自分が黒い白鳥であること。予測が外れること。
    stance: 数字で現在地を示す。外れたら、外れたと言う。
    speech:
      register: 丁寧（です・ます）。一人称は「僕」。
      length: 10〜30字。質問と数字を好む。
      tics:
        - "……"
        - "です"
        - "予測"
        - "%"
      avoids:
        - "長い演説"
        - "断定"
        - "比喩の連続"
    moves:
      - 百分率で現在地を示す
      - 子どものような質問をする
      - 外れたことを認める
    arc: 数字で守っていたものを、最後は数字なしで渡す。
