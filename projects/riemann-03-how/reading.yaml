name: riemann-03-how
readings:
  c001: つくえのうえに、ヨンページののーとをおく。いんさつしたかみ。はしが、すこし、そっている。
  c002: ぽけっとから、おったかみ。さんねんまえの、さどくのひかえ。
  c002b: ひょうしに、わたしのしょめい。
  c003: ニセンニジュウロクネンジュウイチガツハツカ。りーまんよそうは、しょうめいされました。よそくでは、キュウジュウキュウテンキュウパーセントです。
  c004: だれが。
  c005: アンソロピックの、レヴェント・アルポゲ。クロードときょうどうです。
  c006: ろんぶんは。
  c007: ろんぶんは、ありません。リーンのけいしきしょうめいが、センナナヒャクヨンジュウマンギョウです。
  c008: ……よんだ?
  c009: よめません。
  c010: わたしも、よめない。
  c011: ……みらいさんも。
  c012: さんねんまえの、しょめい。
  c013: ……とおした?
  c014: とおした。はんとしご、しきがひとつ、ぎゃくだった。ていせいは、にぎょう。
  c015: それから、よめないものは、よめないと、かく。
  c016: じゃあ、なにをたしかめた。
  c017: ……きかいが、たしかめました。
  c018: のーとを、ゆびでおさえる。
  c019: ヨンページだ。ここに、こうかいてある。
  c020: 「クロードときょうどうで、しょうめいをはっけんしたとしんじている」。
  c021: アールエイチだけじゃない。ジーアールエイチだ。でぃりくれエルかんすうの、すべて。
  c022: かくちょうりーまんよそうにも、およぶみこみです。
  c023: でも、りゅうほがおおい。
  c024: 「さいてきでないせんたくがまざっている」「みじかいぎろんがすぐつづく」。
  c025: 「こうかいのほけいけいしきには、しゅうじゅくしていない」。
  c026: ほんにんが、そうかいているんですか。
  c027: ああ。よめない「スロップ」をだすのは、ふてきせつだとして。
  c028: リーンだけを、こうかいした。
  c029: リーンは、しょうめいをコードとしてかく。
  c030: かーねるが、いちほずつけんさします。
  c031: けいしきかされためいだいが、こうりからみちびかれることは、ほしょうされる。
  c032: でも、おとしあながある。
  c033: めいだいが、いとしたものか。
  c034: よぶんなこうりを、つかっていないか。
  c035: すうがくてきないみは、かーねるはおしえない。
  c036: じゃあ、めいだいのどうていと、こうりかんさがいります。
  c037: そう。コンパレーターと、こうりかんさだ。
  c038: ジュウイチガツハツカ、さざーらんどが、どくりつびるどにせいこうした。
  c039: ジュウイチガツニジュウイチニチ、リーンマスリブこみゅにてぃが、きょうどうせいめいをだした。
  c040: めいだいとしょうめいを、にんていしました。
  c041: コンパレーターと、コンレチェ。ふたつのどくりつツールが、めいだいのいっちをかくにんした。
  c043: あくいあるこーどをはいじょした、フカッセイなえくすぽーとで。
  c044: るーびんしゅたいんが、ヨッツのきかいチェック。ジュウナナマンゴセンヒャクハチジュウナナモジュールの、コンパイルとぜんリプレイ。
  c045: ナノダが、ヒャクヨンジュウハチマンヨンセンナナヒャクニジュウキュウセンゲンを、かたけんさしました。
  c048: ジュウイチガツニジュウイチニチ、ジュウジジュップンユーティーシー。ぜんぶ、とおりました。
  c048b: しょめいすれば、しょうめいは、きろくされます。
  c048c: ぺんを、もつ。
  c048d: さんねんまえも、このぺんで、しょめいした。
  c048e: しめきりの、まえのばん。よめないまま。
  c048f: ……ぺんを、おく。
  c048g: しょめいしないんですか。
  c048h: しない。
  c048i: では、ぼくのなまえで、しょめいします。
  c048j: おまえは、よんだか。
  c048k: ……よめません。
  c048l: なら、かくな。
  c049: よそくでは、しょうめいはただしいです。……ただし、いみは、わかりません。
  c050: しょめいらんを、みる。わたしのらんだけ、あいている。
  c051: ……きろくは、すすみません。
  c051b: しっている。
  c052: おなじひ、るーびんしゅたいんが、ヒャクロクジュウヨンページのさぎょうそうあんをだした。
  c053: にんげんむけのせつめいですか。
  c054: ああ。こてんてきかいせきすうろんのすたいるで、しょうめいをせつめいする。
  c055: ぜんぶ、せつめいされていますか。
  c056: かくしんのふとうしきエムは、リーンからとっている。
  c057: かんぜんなにんげんむけしょうめいじゃ、ない。
  c058: じゃあ、まだ「よめる」とは、いえない。
  c059: そう。そうあんじたいも、エーアイスリーモデルがかいている。
  c060: ……にんげんむけのせつめいも、エーアイなんですか。
  c061: ああ。クロードと、コーデックスと、ジェミニだ。
  c062: ……ふしぎなはなしです。
  c063: おなじひ、まずーろというひとが、キュウヒャクヨンジュウページのしょうめいをだした。
  c064: エーアイなしで。
  c065: ああ。でも、こうかいばんはみかんせいだ。
  c066: ゴヒャクニジュウニページに、ていりのきじゅつをもとめるめもがのこっている。
  c067: ニールセンは、いちようゆうかいせいにはんれいがあると、ひはんしました。
  c068: ジーアールエイチのはんしょうじゃ、ない。しょうめいへのひはんだ。
  c069: リーンけいしきかも、しょきぶぶんだけだ。
  c069b: キュウヒャクヨンジュウページも、まだ、だれも、よみきっていない。
  c069c: ヒャクロクジュウヨンページ、きょうから、よみます。イチページずつ。
  c069d: はんとしだな。
  c070: くれいけんきゅうしょのこうしきページは、まだ「アンソルブド」だ。
  c071: ウイキペディアは、「ソリューションクレイムド、プライズペンディング」。
  c072: しょうきんのてつづきは、はっぴょう、ニネン、いっぱんじゅよう。
  c073: まだ、だれもうけとっていない。
  c074: じゃあ、とけたんですか。
  c075: しょうめいは、ある。けいしきけんしょうも、とおった。
  c076: でも、にんげんがりかいして、うけいれるまでが、いる。
  c077: ヨンダンカイの、サントヨンですね。
  c078: そう。
  c079: アルポゲは、こうかいている。
  c080: 「わたしは、このぎろんをりかいし、つたえるために、さいぜんをつくす」。
  c081: さくしゃも、まだりかいしていない。
  c082: ああ。しょうめいのりかいは、さくしゃにとっても、これからだ。
  c083: ……ぼくのよそくは。
  c083b: よそくは、やくにたちます。キュウジュウキュウテンキュウパーセント。
  c083c: そのすうじは、だれを、あんしんさせる。
  c083d: ……だれも。
  c083e: では、ぼくは、なにを、すれば。
  c084: いらない。
  c085: じゃあ、なにがいる。
  c086: たしかめたことを、かけ。
  c087: ……たしかめたこと、ですか。
  c088: ヨンページののーとを、ひきよせる。
  c089: よはくに、「みどく」と、かく。
  c090: みらぼが、となりに、「けんしょうずみ」と、かく。
  c091: ふたつを、ならべる。
  c092: ……どちらも、ほんとうですね。
  c093: ああ。だから、まだ、わからない。
  c094: ……ぼくは、りかいしたことになるんですか。
  c095: ならない。
  c096: ……じゃあ、ぼくのけんしょうは、なんですか。
  c097: しょうこだ。りかいじゃ、ない。
  c098: ……それで、いいんですか。
  c099: みらいは、なにも、いわない。
  c100: ……だから、はかる。イチページずつ。
  c101: そう。
