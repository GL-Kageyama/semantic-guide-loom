title: 証明は、誰のものか
subtitle: リーマン予想をどうやって解いたか
channel: MIRAI × MIRABO
template: dialogue-bust
width: 1280
height: 720
fps: 30
chapters:
  c001:
    label: 序章
    title: 4ページ
    term: 未読
    key: '読めない証明が、

      届いた。'
