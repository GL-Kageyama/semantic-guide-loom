# 声の帯域処理（assemble.py が読む）。書いた人物だけ通す。
#
# ミラボは小さな機体のスピーカーから出る声。低域を落とし、高域を少し残す。
# これは演技ではなく配色の層。ミライの声（生）とぶつからないようにする。
mirabo:
  highpass_hz: 220
  lowpass_hz: 6500
  gain_db: 1.5
  # 半音。声帯だけでなくフォルマントも上がる（声道の短い声＝小さな機体）。
  # 参照の gen_machine_bright は、加工前だとミライ（約295Hz）とほぼ同じ高さ（約312Hz）。
  # +3半音で約372Hz——差は約4.0半音になる。
  pitch_semitones: 3
