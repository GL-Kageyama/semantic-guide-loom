facts:
  - id: law
    question: オームの法則は何を主張するか。抵抗はどう定義するか
    answer: 温度が変わらなければ、電流は電圧に比例する。比例定数が抵抗 R。抵抗は R = V/I で定義され、1Ω は 1V で 1A が流れる抵抗。
  - id: condition
    question: 電流が2倍になったとき、式だけでその理由を決められるか
    answer: 決められない。電圧が2倍になったのか、抵抗が半分になったのかは、式だけでは分からない。電圧を変えて電流を測る必要がある。
  - id: ohmic
    question: R が一定かどう確かめるには、何を見るか。そのときの抵抗を何というか
    answer: 電圧を変えて電流を測り、V/I が同じかを見る。グラフは原点を通る直線になる。R が一定とみなせる抵抗をオーム抵抗という。
  - id: lamp
    question: 電球はなぜオームの法則に従わないのか
    answer: フィラメントが高温になり、金属の抵抗が温度で上がるから。R が一定でない。ある電球では冷間13.9Ω、点灯71.3Ω（約5倍）。
  - id: led
    question: LED を9Vの電源で使うとき、なぜ直列抵抗が必要か。抵抗値はいくらか
    answer: LED は閾値までほとんど流れず、超えると急に流れる。電流を決めるには直列抵抗を入れる。Vf 2V、目標20mAなら R = (9−2)/0.02 = 350Ω。抵抗がないと電流が過大になり壊れる。
  - id: history
    question: オームはいつ法則を発表し、いつ評価されたか。単位はいつか
    answer: 1827年に本を出した。1841年にコプリーメダル（存命中）。1881年に抵抗の単位がオームになった（死後）。
  - id: repair
    question: 妹の常夜灯はどう直ったか。妹はそれを知っていたか
    answer: 一度目のスイッチでは暗く、抵抗を測ると3.5kΩだった。350Ωに替えて二度目で点いた。妹は最初から知っていて「知ってた」と返した。
