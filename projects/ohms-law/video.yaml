# 映像側の台本（音には渡さない）。
title: オームの法則
subtitle: 抵抗は、一定か
channel: MIRAI × MIRABO
template: dialogue-bust
cast: mirai-mirabo
chapters:
  c001:
    label: 序章
    title: 三つ、置く
    term: 予測
    key: "同じ式で、\n二つは、違った。"
    details:
    - cue: c021
      head: 抵抗器
      lines:
      - 2Vで 0.20A
      - 4Vで 0.40A
      - 電流は2倍
      - ※説明用の例
      fact: in-work-demo
    - cue: c027
      head: 電球
      lines:
      - 1Vと 2Vをかける
      - 電流は2倍にならない
      - 電球は、比例しない
      fact: in-work-lamp
  c038:
    label: 第1章
    title: 三つの量
    term: 抵抗
    key: "式は、R を\n決めただけ。"
    details:
    - cue: c039
      head: 三つの量
      lines:
      - 電圧 V（ボルト）
      - 電流 I（アンペア）
      - 抵抗 R（オーム）
      fact: resistance-definition
    - cue: c047
      head: 1オーム
      lines:
      - 1Vで 1Aが流れる
      - 1Ω = 1V/A
      fact: resistance-definition
    - cue: c050
      head: 計算例
      lines:
      - 6Vの電池
      - 3Ωの抵抗
      - 電流は 2A
      - ※説明用の例
      fact: in-work-example
  c067:
    label: 第2章
    title: 直線になる条件
    term: 比例
    key: "R は、\n一定か。"
    details:
    - cue: c068
      head: 測定
      lines:
      - 1V → 0.10A
      - 3V → 0.30A
      - 5V → 0.50A
      - どれも 10Ω（例）
      fact: in-work-demo
    - cue: c086
      head: オームの実験
      lines:
      - 1826年
      - 銅線 2〜130インチ
      - 熱電対
      - ねじり秤
      fact: ohm-1826
    - cue: c101
      head: オーム抵抗
      lines:
      - 電圧を変えても
      - V/I が同じ
      - R が一定
      fact: ohmic-material
  c120:
    label: 第3章
    title: 同じ電球なのに
    term: 温度
    key: "壊れては\nいない。"
