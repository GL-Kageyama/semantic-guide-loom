# v6 の視聴者テストで問うた事実。design.md の「説明の鎖」から。
facts:
  - id: cause
    question: 像がぼやけた原因は何か
    answer: 研磨に使った検査装置（null corrector）のレンズ間隔が 1.3 mm ずれ、その装置を基準に磨いたので、鏡が設計と違う形になった。縁が 2.2 µm 平らになり、光が一点に集まらなかった。
  - id: fix
    question: どう直したか
    answer: 1993年の整備で COSTAR を入れ、既知の誤差を光の入り口で打ち消した。鏡は削り直していない。
  - id: numbers
    question: 99.8% / 97% / 99.4% / 78〜91% / 「—」は、それぞれ何を測った数字か
    answer: 99.8%=検査との一致率 / 97%=研磨の精度 / 99.4%=検査装置の自己一致率 / 78〜91%=補正後の像と二つの参照像それぞれの一致率 / 「—」=分母が言えないことの表示。
  - id: rejected
    question: 退けられた検査とは何か、なぜ退けられたか
    answer: 屈折式の別検査は「鏡がおかしい」と示したが、「精度が低い」として退けられた。理由は測定値ではなく、反射式の方を正確だと信じていたこと。
  - id: paper
    question: 机の端の紙と「精度が低い」のラベルは、何を表しているか
    answer: 退けられた検査の結果の紙。ラベルは、その検査を退けた理由。終章でミラボが自分の手から出し、ラベルの下から鏡の形の線が現れる。
