# 声に読ませるための読み。字幕は script.yaml / video.yaml が持つ。
# 数字・英字・記号は、誤読を避けるためカタカナで固定している。
# TTS の前処理が「すうは」を「かずは」に置換するため、「素数は」「双子素数は」「個数は」は漢字で固定。
# 「不活性」はフカッセイ（ひらがなだと促音が落ちる）。
name: riemann-02-consequences
readings:
  c001: つくえのうえに、かみのたばをおく。もちあげる。おもい。ひょうしに、「アールエイチをかていしたていり」とかいてある。
  c001b: たばのよこに、ふうとう。しめきりは、きんよう。うえに、とうこうよこくのかみ。おなじだいが、たにんのなまえで。
  c002: よそくでは、りーまんよそうがとければ、そすうにかんするもんだいは、すべてとけます。かくりつは、キュウジュウキュウテンハチパーセント。
  c003: ぜんぶ?
  c004: ぜんぶです。
  c005: かーどに、「ぜんぶ」とかく。
  c006: 双子素数は。
  c007: ……それは、べつのもんだいです。
  c008: ごーるどばっはは。
  c009: ……べつです。
  c010: 「ぜんぶ」を、あかぺんで、けす。ぺんさきが、かみに、くいこむ。
  c011: ぜんぶは、どこまでだ。
  c012: ……よそくのはんいを、せばめます。
  c013: アールエイチがなりたてば、パイエックスは、エルアイ エックスに、ルートエックスログエックスのごさでちかづく。
  c014: ふぉん・こっほのひょうかです。
  c015: ヒャクマンで、パイワ、ナナマンハッセンヨンヒャクキュウジュウハチ。エルアイは、やくナナマンハッセンロッピャクニジュウハチ。さは、ヒャクサンジュウ。
  c016: アールエイチがほしょうするじょうげんは、やくゴヒャクゴジュウ。じっさいのさは、そのなかにある。
  c017: へいきんは、もっとせいかくになります。
  c018: ああ。でも、いちは、わからない。
  c019: シェーンフェルドのひょうか、そすうぎゃっぷ、くかんのそすう。
  c020: ぜんぶ、へいきんとゆらぎのはなしですね。
  c021: そう。そすうの「こせい」は、べつだ。
  c022: わたしは、このたばのていりを、ひとつ、つかっている。
  c023: ……アールエイチをかていしたていりを。
  c024: ひきだしから、へんきゃくされたろんぶんを、だす。ひょうしに、さどくのふせん。
  c025: 「じょうけんつきのけっかは、ていりではない」。さどくしゃの、いっこう。
  c026: さんねんまえの、へんきゃく。ふせんは、まだ、はがしていない。
  c026b: だから、こんどは、とおしたい。
  c027: そのていりは、アールエイチだけではたりません。ジーアールエイチがいります。
  c028: ……しっている。
  c029: よそくでは、キュウジュウキュウテンニパーセント、ジーアールエイチもとけます。
  c030: よそくは、いい。こんきょを、いえ。
  c031: ……こんきょは、まだ、ありません。
  c032: なら、じょうけんつきだ。
  c032b: ひょうしのじょうけんを、けせば、とおるかくりつは、ヨンジュウイチパーセント。
  c032c: ……けせば。
  c032d: ぺんを、ひょうしのうえで、とめる。
  c032e: ……けさない。
  c033: たばを、もちあげる。おもい。ひょうしに、「じょうけんつき」と、かく。
  c034: それで、だせるんですか。
  c035: まえのろんぶんは、だせなかった。こんどは、きんようまでに、いれる。
  c036: アールエイチをかていしたていりは、すうひゃくある。
  c037: かていがきえると。
  c038: むじょうけんになる。
  c039: たとえば、あるてぃんのげんしこんよそう。ジーアールエイチのもとで、ふーりーがしょうめいした。
  c040: ジーアールエイチは、でぃりくれエルかんすうのアールエイチです。
  c041: そう。アールエイチより、つよい。
  c042: あるごりずむにもきく。ミラーラビンは、ジーアールエイチのもとでけっていてきになる。
  c043: じゃあ、あんごうがおわります。……よそくでは、キュウジュウキュウパーセントです。
  c044: アールエスエーは、そいんすうぶんかいのむずかしさだ。
  c045: アールエイチは、そのむずかしさを、ちょくせつはゆるがさない。
  c046: ……てっかいしません。
  c047: ……なぜ。
  c048: よそくは、はずれていません。あんごうのいちぶは、ジーアールエイチをかていしたひょうかのうえに、のっています。
  c049: ……そうだ。いちぶは、な。
  c050: てっかいは、いらない。はんいを、いえ。
  c051: はんいは、ジーアールエイチをかていするあるごりずむです。
  c051b: よそくのすうじは、もう、だしません。
  c052: ……それで、いい。たばを、とじる。
  c053: アールエイチがとけても、双子素数は、のこる。
  c054: ごーるどばっはも、のこる。
  c055: そすうのいちも、ぜんぶはわかりません。
  c056: ヒャクイチ、ヒャクサン、ヒャクナナ、ヒャクキュウ、ヒャクジュウサン。
  c057: かんかくは、ニ、ヨン、ニ、ヨン。
  c058: このならびは、へいきんからは、でない。
  c059: ……それが、こせいですか。
  c060: そう。へいきんは、このならびを、おしえない。
  c061: ばざーどは、アールエイチは「やまのふもと」だという。
  c062: かくちょうりーまんよそう、だいりーまんよそう。うえがある。
  c063: じゃあ、とけても、おわりじゃない。
  c064: おわりじゃ、ない。
  c065: わたしのたばは、どこまで、かたづく。
  c066: 「とけた」には、だんかいがある。
  c067: しょうめいがある。けいしきけんしょうがとおる。にんげんがりかいする。こみゅにてぃがうけいれる。
  c068: ニセンニジュウロクネンのしゅちょうは、どこまで。
  c069: けいしきけんしょうは、かんりょうした。
  c070: でも、かんぜんなにんげんむけしょうめいは、まだない。
  c071: さどくも、くれいしょうのてつづきも、みりょうだ。
  c072: くれいしょうは、はっぴょう、ニネン、いっぱんじゅよう。
  c073: そう。こうかいしただけでは、しょうきんはでない。
  c074: じゃあ、みらいさんのていりは、まだじょうけんつきですね。
  c075: ああ。だから、だす。
  c076: ……じょうけんつきで、ですか。
  c077: かんぜんなしょうめいがでるまで、まつこともできる。
  c077b: でも、そのかみ。おなじだいが、たにんのなまえで、のっていた。
  c078: ……またないんですね。
  c079: またない。きんように、いれる。
  c080: アールエイチは、そすうのへいきんを、さいりょうのせいどでおしえる。
  c081: でも、そすうのぜんぶを、おしえるわけじゃない。
  c082: とけた、ということばも。
  c083: ああ。しょうめいと、けんしょうと、りかいと、じゅよう。
  c084: ぜんぶそろって、はじめて、ていりになる。
  c085: ……じゃあ、いまは。
  c085b: かーどを、にまい、とりだす。
  c086: いちまいに、「じょうけんつき」とかく。
  c086b: もういちまいを、みらぼに、わたす。
  c087: みらぼが、ぺんを、さしだす。
  c087b: ……それは、わたしが、かく。
  c087c: ぺんをうけとる。「そくていちゅう」と、かく。
  c088: にまいを、ならべる。
  c089: ……どちらも、ほんとうですね。
  c090: ああ。だから、ふうとうに、いれる。
  c091: じょうけんつきで。
  c092: じょうけんつきで。
  c092b: ふうとうを、しばらく、みる。
  c093: かーどを、ふうとうに、いれる。
  c094: ……だしますか。
  c095: だす。
  c095b: ……よまれますか。
  c095c: わからない。
