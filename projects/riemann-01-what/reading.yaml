# 声に読ませるための読み。字幕は script.yaml / video.yaml が持つ。
# 数字・英字・記号は、誤読を避けるためカタカナで固定している。
# TTS の前処理が「すうは」を「かずは」に置換するため、「素数は」「双子素数は」「個数は」は漢字で固定。
# 「不活性」はフカッセイ（ひらがなだと促音が落ちる）。
name: riemann-01-what
readings:
  c001: つくえのうえに、そすうひょうをおく。かみのかどが、めくれている。
  c001b: よはくのじは、わたしのだ。がくせいのころの。
  c002: よそくでは、ヒャクマンいかのそすうの個数は、ナナマンハッセンヨンヒャクキュウジュウハチコです。かくりつは、キュウジュウキュウテンニパーセント。
  c003: かぞえた?
  c004: かぞえなくても、わかります。個数は、へいきんからでます。
  c005: つぎの素数は。
  c006: ……それは、よそくのはんいのそとです。
  c007: はずれた。
  c008: ……はずれました。
  c009: よそくを、ひとつ、すてます。
  c010: すてろ。
  c011: かずはあたる。ばしょは、あたらない。
  c012: ……なぜでしょう。
  c013: きょう、みる。
  c014: がくせいのころ、つぎのそすうを、よそくでかいた。
  c015: ……あたったんですか。
  c016: あかで、ばつだった。
  c017: うらを、かえす。せいのじが、さんねんぶん。
  c018: 素数は、ニ、サン、ゴ、ナナ、ジュウイチ。このせいのじは、そこからだ。
  c019: ならびは、ふきそくにみえます。
  c020: ちかくはな。ヒャクイチ、ヒャクサン、ヒャクナナ、ヒャクキュウ、ヒャクジュウサン。
  c021: かんかくは、ニニモ、ヨンニモ、ロクニモなる。
  c022: でも、かぞえると、きそくてきです。
  c023: エックスいかのそすうのコスウを、パイエックスとかく。
  c024: パイエックスは、ログエックスブンノエックスにちかづく。そすうていりだ。
  c025: センハッピャクキュウジュウロクネンに、しょうめいされています。
  c026: ヒャクマンで、ナナマンハッセンヨンヒャクキュウジュウハチ。よそくは、あたった。
  c027: たいすうせきぶんなら、ナナマンハッセンロッピャクニジュウハチ。さは、ヒャクサンジュウです。
  c028: へいきんは、せいかくだ。
  c029: じゃあ、素数は、よそくできるんですね。
  c030: かずはな。ばしょは、べつだ。
  c031: ひょうの、まるのつぎを、ゆびでなぞる。
  c032: くうはくだ。どのかずがつぎかは、へいきんからは、でない。だから、わたしは、かぞえる。
  c033: そすうをかぞえるかんすうを、ぜーたかんすうのれいてんでかける。
  c034: れいてんですか。
  c035: ゼータカッコエスイコールゼロになる、エスだ。
  c036: じめいなれいてんは、マイナスニ、マイナスヨン、マイナスロク。
  c037: ひじめいなれいてんは、ゼロトイチのあいだのおびにある。
  c038: それが、そすうのぶんぷをきめるんですか。
  c039: めいじこうしきだ。れいてんのわが、そすうのごさになる。
  c040: れいてんのじつぶがちいさいほど、ごさはちいさい。
  c041: じつぶが、ニブンノイチなら。
  c042: ごさは、ルートエックスていどになる。
  c043: これが、りーまんよそうだ。
  c044: すべてのひじめいなれいてんは、じつぶニブンノイチのせんじょうにある。
  c045: よそくでは、キュウジュウキュウテンキュウパーセント、なりたちます。
  c046: よそくじゃない。しょうこだ。
  c047: さいしょのジュッチョウコは、せんじょうにある。かくにんずみだ。
  c048: れいてんぜんたいの、ヨンジュウイチテンロクパーセントいじょうが、せんじょうにあるとしょうめいされている。
  c049: じゃあ、ぜんぶですか。
  c050: ゆうげんこをみたって、ぜんぶのしょうめいにはならない。
  c051: わたしも、ぜんぶはわかっていない。
  c052: ……みらいさんでも。
  c053: かぞえても、わからない。だから、たしかめる。
  c054: なぜ、ニブンノイチなんですか。
  c055: かんすうとうしきだ。
  c056: エスを、イチマイナスエスにうつす。れいてんは、そのかがみでたいしょうになる。
  c057: たいしょうのじくが、じつぶニブンノイチのせんだ。
  c058: だから、そこにぜんぶある、と。
  c059: よそうは、そういう。
  c060: しょうこは、そろっています。
  c061: たおは、かいせきだけではたりないという。
  c062: ぜーたかんすうをすこしうごかすと、れいてんはせんからうごく。
  c063: ほけいけいしき、だいすうてきせいすうろん、すうろんきか。げんだいすうがくのどうぐがいる。
  c064: よそくでは、いつかとけます。
  c065: いつか、は、はかれない。
  c066: センハッピャクゴジュウキュウネンに、りーまんがていしょうした。
  c067: ニセンネンには、みれにあむけんしょうもんだい。ヒャクマンドル。
  c068: ヒャクロクジュウナナネン、しょうめいはえられなかった。
  c069: でも、ニセンニジュウロクネンジュウイチガツハツカ。
  c070: しょうめいしたとしゅちょうするひとがいます。
  c071: だれが。
  c072: アンソロピックの、レヴェント・アルポゲ。クロードときょうどうです。
  c073: ろんぶんは。
  c074: ヨンページののーとと、センナナヒャクヨンジュウマンギョウのけいしきしょうめいです。
  c075: ……よんだ?
  c076: よめません。
  c077: わたしも、よめない。
  c078: ……みらいさんも。
  c079: ああ。だから、なにをたしかめた。
  c080: ……きかいが、たしかめました。
  c081: ヨンページののーとを、ゆびでおさえる。
  c082: センナナヒャクヨンジュウマンギョウ。にんげんが、いっしょうかけても、よみきれないりょうだ。それを、きかいが、ひとばんでとおした。
  c083: カードを、だす。ナナマンハッセンヨンヒャクキュウジュウハチと、くうはく。
  c084: くうはくに、センナナヒャクヨンジュウマンギョウと、かく。
  c085: ……ぼくのよそくは。
  c086: いらない。
  c087: はずれたことを、きろくしろ。
  c088: ……きろく、ですか。
  c089: ここに、はずれたと、かけ。
  c090: みらぼが、かーどに、「はずれた」とかく。
  c091: ……よそくのすうじが、でません。
  c092: ださなくていい。
  c093: ……これが、きろく、ですか。
  c094: ああ。あしたも、かく。
  c095: ……あしたは、かぞえます。ひゃくまんまで。
  c096: かぞえたら、かけ。
